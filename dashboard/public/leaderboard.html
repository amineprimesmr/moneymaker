<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement — MoneyMaker</title>
<meta name="description" content="Le classement public des apps et startups, sur des revenus vérifiés par l'App Store, Google Play et Stripe.">
<meta property="og:title" content="Classement MoneyMaker : revenus vérifiés">
<meta property="og:description" content="MRR, revenus et croissance vérifiés directement par les stores. Aucun chiffre déclaré à la main.">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/app.css">
<style>
  .lb { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  .lb-head { text-align: center; margin-bottom: 28px; }
  .lb-head img { width: 200px; height: auto; }
  .lb-head p { color: var(--muted); margin: 10px 0 0; }
  .lb-tabs { display: flex; gap: 4px; justify-content: center; margin: 0 auto 26px; padding: 4px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); width: fit-content; max-width: 100%; overflow-x: auto; }
  .lb-tabs button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; white-space: nowrap; }
  .lb-tabs button[aria-pressed="true"] { background: rgba(255,255,255,.12); color: var(--text); }
  .podium { display: grid; grid-template-columns: 1fr 1.2fr 1fr; align-items: end; gap: 0; margin-bottom: 26px; position: relative; }
  .podium::before { content: ""; position: absolute; left: 50%; top: -60px; width: 70%; height: 340px; transform: translateX(-50%);
    background: radial-gradient(ellipse at top, rgba(237,207,133,.22), transparent 70%); pointer-events: none; }
  .step { text-align: center; position: relative; }
  .step .ico { width: 64px; height: 64px; border-radius: 22.37%; object-fit: cover; background: var(--panel2); display: grid; place-items: center; margin: 0 auto 8px; font-weight: 600; font-size: 24px; }
  .step:nth-child(2) .ico { width: 82px; height: 82px; }
  .step .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .step .val { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 13px; margin-bottom: 8px; }
  .block { border-radius: 14px 14px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.02)); display: grid; place-items: start center; padding-top: 12px; font-size: 34px; font-weight: 700; color: rgba(255,255,255,.75);
    -webkit-mask: linear-gradient(#000 80%, transparent); mask: linear-gradient(#000 80%, transparent); }
  .step:nth-child(1) .block { height: 120px; } .step:nth-child(2) .block { height: 170px; color: #E0B23C; } .step:nth-child(3) .block { height: 92px; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 30px 40px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 20px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.05); color: inherit; text-decoration: none; }
  .row .rk { text-align: center; font-weight: 700; color: rgba(255,255,255,.48); font-variant-numeric: tabular-nums; }
  .row .ico { width: 40px; height: 40px; border-radius: 22.37%; object-fit: cover; background: var(--panel2); display: grid; place-items: center; font-weight: 600; }
  .row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tg { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row .g { font-size: 12px; text-align: right; }
  .up { color: var(--accent); } .down { color: var(--bad); }
  .badges { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(0,241,159,.12); color: var(--accent); font-weight: 600; }
  .cta { text-align: center; margin-top: 34px; color: var(--muted); }
  .cta a { color: var(--text); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  @media (max-width: 520px) { .step .ico { width: 52px; height: 52px; } .step:nth-child(2) .ico { width: 66px; height: 66px; } .row .tg { display: none; } }
</style>
</head>
<body>
<main class="lb">
  <header class="lb-head">
    <a href="/"><img src="/logo.png" alt="MoneyMaker" width="720" height="249"></a>
    <h1>Classement</h1>
    <p>Revenus vérifiés par l'App Store, Google Play et Stripe. Aucun chiffre saisi à la main.</p>
  </header>
  <nav class="lb-tabs" aria-label="Critère de classement">
    <button data-sort="mrr" aria-pressed="true">MRR</button>
    <button data-sort="revenue" aria-pressed="false">Revenus 30 j</button>
  </nav>
  <section id="podium" class="podium" aria-label="Podium"></section>
  <section id="rows" class="rows" aria-live="polite"></section>
  <p class="cta">Ton business sur le classement : connecte-le à MoneyMaker, il y apparaît automatiquement. <a href="/">Commencer</a></p>
  <p class="cta" id="updated"></p>
</main>
<script>
const SOURCES = { appstore: "App Store", googleplay: "Google Play", stripe: "Stripe" };
const eur = m => (m / 1e6).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: m >= 1e9 ? 0 : 2 });
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let sort = ["mrr", "revenue"].includes(new URLSearchParams(location.search).get("sort")) ? new URLSearchParams(location.search).get("sort") : "mrr";

function value(e) {
  switch (sort) {
    case "revenue": return e.revenue30dMicros == null ? e.revenueRange : eur(e.revenue30dMicros);
    case "growth": return e.growth30d == null ? "—" : `${e.growth30d >= 0 ? "+" : ""}${Math.round(e.growth30d * 100)} %`;
    case "subscribers": return e.activeSubscriptions.toLocaleString("fr-FR") + " abonnés";
    default: return e.mrrMicros == null ? e.mrrRange : eur(e.mrrMicros) + "/mois";
  }
}
const icon = e => e.iconUrl ? `<img class="ico" src="${esc(e.iconUrl)}" alt="" loading="lazy">` : `<div class="ico">${esc(e.name[0]?.toUpperCase())}</div>`;
const link = e => e.website ? `href="${esc(e.website)}" target="_blank" rel="noopener nofollow"` : "";

async function load() {
  document.querySelectorAll(".lb-tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sort === sort)));
  const rows = document.getElementById("rows"), podium = document.getElementById("podium");
  try {
    const r = await fetch(`/v1/leaderboard?sort=${sort}&limit=200`).then(r => r.json());
    const top = r.entries.slice(0, 3), rest = r.entries.slice(3);
    podium.innerHTML = [top[1], top[0], top[2]].map((e, i) => `<a class="step" ${e ? link(e) : ""} style="color:inherit;text-decoration:none">
      ${e ? `${icon(e)}<div class="nm">${esc(e.name)}</div><div class="val">${esc(value(e))}</div>` : `<div class="ico">+</div><div class="nm muted">Libre</div><div class="val">&nbsp;</div>`}
      <div class="block">${[2, 1, 3][i]}</div></a>`).join("");
    rows.innerHTML = rest.length ? rest.map(e => `<a class="row" ${link(e)}>
      <span class="rk">${e.rank}</span>${icon(e)}
      <span style="min-width:0"><div class="nm">${esc(e.name)}<span class="badges">${e.sources.map(s => `<span class="badge">✓ ${SOURCES[s] ?? s}</span>`).join("")}</span></div>
        <div class="tg">${esc(e.tagline ?? "")}</div></span>
      <span><div class="v">${esc(value(e))}</div>${e.growth30d != null && sort !== "growth" ? `<div class="g ${e.growth30d >= 0 ? "up" : "down"}">${e.growth30d >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(e.growth30d * 100))} %</div>` : ""}</span>
    </a>`).join("") : (r.entries.length ? "" : `<div class="empty">Le classement démarre : sois le premier business inscrit.</div>`);
    document.getElementById("updated").textContent = `${r.total} business · mis à jour ${new Date(r.updatedAt).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
  } catch {
    rows.innerHTML = `<div class="empty">Classement indisponible pour le moment.</div>`;
  }
}
document.querySelectorAll(".lb-tabs button").forEach(b => b.onclick = () => { sort = b.dataset.sort; history.replaceState(null, "", `?sort=${sort}`); load(); });
load();
</script>
</body>
</html>
