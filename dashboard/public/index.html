<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyMaker</title>
<meta name="description" content="Abonnements App Store, Google Play et Stripe centralisés.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2300F19F'/><text x='16' y='23' font-size='18' text-anchor='middle' font-family='system-ui' font-weight='800' fill='%23000'>$</text></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="wl-screen hidden">
  <section class="wl-hero">
    <div class="wl-badge-wrap">
      <div class="wl-badge-glow"></div>
      <div class="wl-badge"><span class="wl-badge-spin"></span><span class="wl-badge-label"><i class="wl-dot"></i>Tes revenus, en direct</span></div>
    </div>
    <h1 class="wl-title wl-logo"><img src="/logo.png" alt="MoneyMaker" width="720" height="249"></h1>
    <p class="wl-sub">Tous tes abonnements App Store, Google Play et Stripe au même endroit.</p>
    <div class="wl-card-shell">
      <span class="spin"></span><span class="spin blur"></span>
      <div class="wl-card">
        <span class="wl-card-glow"></span><span class="wl-card-edge"></span>
        <button id="google" class="wl-google wide" type="button">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continuer avec Google
        </button>
        <div class="sep">ou</div>
        <form id="emailForm" class="stack">
          <div class="wl-field"><span class="spin"></span><input id="email" type="email" placeholder="ton@email.com" autocomplete="email" required></div>
          <div class="wl-field"><span class="spin"></span><input id="password" type="password" placeholder="Mot de passe (8+ caractères)" autocomplete="current-password" minlength="8" required></div>
          <button class="primary wide wl-submit" type="submit">Connexion</button>
          <button id="signup" class="ghost wide" type="button">Créer un compte</button>
        </form>
        <p id="loginError" class="error" role="status"></p>
      </div>
    </div>
  </section>
  <footer class="wl-foot">
    <div><a href="/guide">Guide en 15 minutes</a><span>·</span><a href="/docs">Référence API</a><span>·</span><a href="/llms.txt">llms.txt</a></div>
    <div>© 2026 MoneyMaker</div>
  </footer>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand"><span class="logo sm">$</span> MoneyMaker</div>
    <button class="nav active" data-view="overview">Vue globale</button>
    <div class="label">Business</div>
    <div id="projectNav"></div>
    <button id="newProject" class="ghost small">+ Nouveau business</button>
    <div class="spacer"></div>
    <button class="nav" data-view="account">Compte & accès</button>
    <button id="logout" class="ghost small">Déconnexion</button>
  </aside>
  <main id="main"></main>
</div>

<dialog id="modal"><form method="dialog" id="modalBody"></form></dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
