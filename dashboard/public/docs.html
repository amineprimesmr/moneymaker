<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoneyMaker Docs</title><link rel="stylesheet" href="/app.css">
<style>main{margin:0 auto;max-width:860px}h1{margin-top:8px}h2{margin-top:28px}h3{margin-top:20px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)}li{margin:6px 0}pre{margin:10px 0}blockquote{color:var(--muted);margin:0}</style></head>
<body><main><p><a href="/">← Dashboard</a> · <a href="/llms.txt">llms.txt</a></p><div id="doc">Chargement…</div></main>
<script>
const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(https:\/\/[^\s)<]+)/g, '<a href="$1">$1</a>');
fetch("/llms.txt").then(r => r.text()).then(md => {
  let html = "", code = null, list = false;
  for (const line of md.split("\n")) {
    if (/^\s*```/.test(line)) { if (code === null) code = ""; else { html += `<pre>${esc(code)}</pre>`; code = null; } continue; }
    if (code !== null) { code += line.replace(/^ {3}/, "") + "\n"; continue; }
    const li = /^\s*(-|\d+\.)\s+(.*)/.exec(line);
    if (li) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(li[2])}</li>`; continue; }
    if (list) { html += "</ul>"; list = false; }
    const h = /^(#{1,3})\s+(.*)/.exec(line);
    if (h) html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if (line.startsWith(">")) html += `<blockquote>${inline(line.slice(1))}</blockquote>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  document.getElementById("doc").innerHTML = html;
});
</script></body></html>
