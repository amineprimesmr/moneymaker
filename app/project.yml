name: MoneyMakerApp
options:
  bundleIdPrefix: io.moneymaker
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: F2CJGJ69XU
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MoneyMaker:
    type: application
    platform: iOS
    sources: [MoneyMakerApp, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.moneymaker.app
        PRODUCT_NAME: MoneyMaker
        INFOPLIST_KEY_CFBundleDisplayName: MoneyMaker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MoneyMakerApp/MoneyMaker.entitlements
        PROVISIONING_PROFILE_SPECIFIER: MoneyMaker Dev 20261009
    info:
      path: MoneyMakerApp/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: io.moneymaker.app
            CFBundleURLSchemes: [moneymaker]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [remote-notification]
    dependencies:
      - target: MoneyMakerWidgets
  MoneyMakerWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.moneymaker.app.widgets
        PRODUCT_NAME: MoneyMakerWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MoneyMaker
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER: MoneyMaker Widgets Dev 20261009
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
