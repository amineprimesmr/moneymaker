name: moneymaker_flutter
description: Flutter plugin for MoneyMaker — subscriptions for App Store, Google Play and Stripe on your own backend. Wraps the native iOS (StoreKit 2) and Android (Play Billing) SDKs.
version: 1.1.1
homepage: https://github.com/amineprimesmr/moneymaker
repository: https://github.com/amineprimesmr/moneymaker/tree/main/sdk/flutter

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MoneyMakerFlutterPlugin
      android:
        package: io.moneymaker.flutter
        pluginClass: MoneyMakerFlutterPlugin
