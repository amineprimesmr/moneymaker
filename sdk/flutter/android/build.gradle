group 'io.moneymaker.flutter'
version '1.2.0'

buildscript {
    ext.kotlin_version = '2.3.0'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// The native SDK is published on JitPack (see jitpack.yml at the repo root).
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

// Built-in Kotlin (Flutter 3.44+): no `kotlin-android` plugin and no `kotlinOptions` block,
// see https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
apply plugin: 'com.android.library'

android {
    namespace 'io.moneymaker.flutter'
    compileSdk 36

    defaultConfig { minSdk 23 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Same version as this plugin: tag 1.2.0 of github.com/amineprimesmr/moneymaker (sdk/android, Play Billing 8).
    implementation 'com.github.amineprimesmr:moneymaker:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
