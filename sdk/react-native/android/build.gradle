plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.moneymaker.reactnative'
version = '1.1.1'

android {
  namespace "io.moneymaker.reactnative"
  defaultConfig {
    versionCode 2
    versionName "1.1.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Same versions as sdk/android/moneymaker/build.gradle.kts (sources in src/main/java/io/moneymaker).
  api "com.android.billingclient:billing-ktx:7.1.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
